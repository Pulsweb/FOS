workspace: FOS
connections:
  azure_connection: cost_analysis azure management

connection_specs:
  azure_connection:
    base_url: https://management.azure.com
    audience: https://management.azure.com

semantic_model_lakehouses:
  Cost_Analysis_Core_SM.SemanticModel: FOS_Lakehouse.Lakehouse

lakehouse_schemas:
  FOS_Lakehouse.Lakehouse:
    - cost

post_deployment:
  jobs:
    - item: Init_Cost_Analysis_Lakehouse_Tables.Notebook
      parameters:
        _inlineInstallationEnabled:
          type: Bool
          value: true
    - item: Update_Cost_Analysis_delivery.Notebook
  sql_endpoints:
    - FOS_Lakehouse.Lakehouse

folders:
  - name: Cost Analysis
    folders:
      - name: Deployment
        items:
          - Init_Cost_Analysis_Lakehouse_Tables.Notebook
          - Update_Cost_Analysis_delivery.Notebook
      - name: Data Load
        items:
          - 01_Load_Calendar.Notebook
          - 01_Load_Dimensions.Notebook
          - 01_Load_Focus_Fabric.Notebook
          - 01_Load_Cost_AnalysisVersion.Notebook
          - 01_Load_Focus.Notebook
          - 01_Load_Meters.Notebook
      - name: Data Agent
        items:
          - 02_Create_DataAgent.Notebook
      - name: Reservations
        items:
          - 02_Load_DimReservation.Notebook
          - 02_Load_Reservation_Fabric.Notebook
          - 02_Load_Reservation.Notebook
          - Load Reservations.DataPipeline
      - name: Quotas
        items:
          - 02_Load_Quota_Fabric.Notebook
          - Load Quota.DataPipeline
      - name: Maintenance
        items:
          - 03_Optimization.Notebook
      - name: Reporting
        items:
          - Cost_Analysis_Core_Report.Report
          - Cost_Analysis_Core_SM.SemanticModel
